<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420"
     font-family="Helvetica Neue,Arial,sans-serif">
<defs>
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1a1a2e; }
    .subtitle { font-size: 12px; fill: #64748b; }
    .node-title { font-size: 13px; font-weight: 700; fill: #1e293b; }
    .node-text { font-size: 11.5px; fill: #475569; }
    .badge-text { font-size: 11px; font-weight: 600; fill: #fff; }
    .arrow-label { font-size: 11px; font-weight: 600; fill: #334155; }
  </style>
  <marker id="arrow-blue" viewBox="0 0 10 8" refX="9" refY="4"
          markerWidth="8" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,4 L0,8 Z" fill="#3b82f6"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="36" y="36" class="title">Reproduce pipeline</text>
<text x="36" y="56" class="subtitle">Public mix to Formula 4. Analysis of artifacts/published_grid.json does not require a retrain.</text>

<rect x="36" y="88" width="196" height="132" rx="10" fill="#fff" stroke="#bfdbfe"/>
<rect x="48" y="100" width="92" height="22" rx="11" fill="#1d4ed8"/>
<text x="94" y="115" text-anchor="middle" class="badge-text">1. Fetch</text>
<text x="48" y="142" class="node-title">fetch_open_mix.py</text>
<text x="48" y="162" class="node-text">FineWeb-Edu, wiki,</text>
<text x="48" y="178" class="node-text">OpenWebMath, Gutenberg,</text>
<text x="48" y="194" class="node-text">CC WET. Presets demo /</text>
<text x="48" y="210" class="node-text">wave-a / full.</text>

<line x1="232" y1="154" x2="268" y2="154" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>

<rect x="272" y="88" width="196" height="132" rx="10" fill="#fff" stroke="#bfdbfe"/>
<rect x="284" y="100" width="108" height="22" rx="11" fill="#1d4ed8"/>
<text x="338" y="115" text-anchor="middle" class="badge-text">2. Tokenize</text>
<text x="284" y="142" class="node-title">tokenize_corpus.py</text>
<text x="284" y="162" class="node-text">GPT-2 50k uint16 bins</text>
<text x="284" y="178" class="node-text">+ per-token byte lengths.</text>
<text x="284" y="194" class="node-text">unique = filesize / 2.</text>
<text x="284" y="210" class="node-text">Refuse looping D.</text>

<line x1="468" y1="154" x2="504" y2="154" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>

<rect x="508" y="88" width="196" height="132" rx="10" fill="#fff" stroke="#bfdbfe"/>
<rect x="520" y="100" width="96" height="22" rx="11" fill="#1d4ed8"/>
<text x="568" y="115" text-anchor="middle" class="badge-text">3. Train</text>
<text x="520" y="142" class="node-title">make_grid + run_wave</text>
<text x="520" y="162" class="node-text">C = M · D. Formula 1</text>
<text x="520" y="178" class="node-text">batch / LR. Local queue</text>
<text x="520" y="194" class="node-text">or DS_NODES packer.</text>
<text x="520" y="210" class="node-text">SIGTERM only.</text>

<line x1="704" y1="154" x2="740" y2="154" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>

<rect x="744" y="88" width="300" height="132" rx="10" fill="#fff" stroke="#bbf7d0"/>
<rect x="756" y="100" width="120" height="22" rx="11" fill="#15803d"/>
<text x="816" y="115" text-anchor="middle" class="badge-text">4. Analyze</text>
<text x="756" y="142" class="node-title">collect.py + analyze.py</text>
<text x="756" y="162" class="node-text">Live result.json overlays</text>
<text x="756" y="178" class="node-text">published_grid.json.</text>
<text x="756" y="194" class="node-text">OLS on u3 / t1 / t2</text>
<text x="756" y="210" class="node-text">valley proxies: a ≈ 0.539.</text>

<rect x="36" y="248" width="1008" height="140" rx="10" fill="#fff" stroke="#e2e8f0"/>
<text x="52" y="276" class="node-title">Three reproduce levels</text>
<text x="52" y="302" class="node-text">A. Analysis only — python3 scripts/analyze.py  (no GPU, uses artifacts/published_grid.json)</text>
<text x="52" y="324" class="node-text">B. Pipeline smoke — bash scripts/smoke.sh  or  prepare_data.sh demo + run_wave --smoke-steps</text>
<text x="52" y="346" class="node-text">C. Grid train — prepare_data.sh wave-a|full, then run_wave.py / launch_v2.py on Hopper GPUs (96GB HBM)</text>
<text x="52" y="368" class="node-text">iso_c3e19_u3 was stopped ~29% and is not a grid point. s6 @ 3e19 is truncated. Both are dropped from the fit.</text>
</svg>
