<text x="832" y="478" text-anchor="middle" class="note">Left arm of the U is missing: even the smallest model already fits TinyStories.</text>
<rect x="24" y="520" width="1072" height="436" rx="10" fill="#fff" stroke="#e2e8f0"/>
<rect x="40" y="536" width="210" height="24" rx="12" fill="#0f172a"/>
<text x="145.0" y="552.3" text-anchor="middle" class="badge-text">Why the U collapsed</text>
<text x="264" y="553" class="note">IsoFLOP still spent C = M&#xB7;D FLOPs. D was not unique tokens, and the distribution was too easy.</text>
<rect x="40" y="576" width="336" height="168" rx="8" fill="#fef2f2" stroke="#fecaca"/>
<rect x="40" y="576" width="336" height="28" rx="8" fill="#be123c"/>
<rect x="40" y="596" width="336" height="10" fill="#be123c"/>
<text x="208" y="596" text-anchor="middle" class="badge-text">1  Toy domain</text>
<text x="56" y="628" class="node-text">TinyStories is a closed children-story</text>
<text x="56" y="646" class="node-text">distribution. ~8M params already reach</text>
<text x="56" y="664" class="node-text">BPB 0.46. There is no under-capacity</text>
<text x="56" y="682" class="node-text">regime, so the left arm of the U never</text>
<text x="56" y="700" class="node-text">appears.</text>
<rect x="392" y="576" width="336" height="168" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
<rect x="392" y="576" width="336" height="28" rx="8" fill="#c2410c"/>
<rect x="392" y="596" width="336" height="10" fill="#c2410c"/>
<text x="560" y="596" text-anchor="middle" class="badge-text">2  Unique-token loop</text>
<text x="408" y="628" class="node-text">Only 462M unique train tokens. Jobs</text>
<text x="408" y="646" class="node-text">with D &gt; 462M (small M, large C)</text>
<text x="408" y="664" class="node-text">replay the same stories. C=3e17 width a</text>
<text x="408" y="682" class="node-text">asked for 2.49B tokens ~ 5.4 epochs of</text>
<text x="408" y="700" class="node-text">the same 462M.</text>
<rect x="744" y="576" width="336" height="168" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
<rect x="744" y="576" width="336" height="28" rx="8" fill="#1d4ed8"/>
<rect x="744" y="596" width="336" height="10" fill="#1d4ed8"/>
<text x="912" y="596" text-anchor="middle" class="badge-text">3  Large-M starvation</text>
<text x="760" y="628" class="node-text">At fixed C, large M gets tiny D.</text>
<text x="760" y="646" class="node-text">Width h @ C=1e17 saw 28M tokens.</text>
<text x="760" y="664" class="node-text">The model is too big for that budget</text>
<text x="760" y="682" class="node-text">on this domain, so BPB climbs 0.46</text>
<text x="760" y="700" class="node-text">to 1.30. Only the right arm remains.</text>
